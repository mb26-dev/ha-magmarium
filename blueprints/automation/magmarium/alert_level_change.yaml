blueprint:
  name: Magmarium - volcano alert level changed
  description: >-
    Sends a notification when the alert level of a watched volcano changes, and
    optionally when an ash cloud is reported. Watched volcanoes are set in the
    Magmarium options; each one has its own sensor.
  domain: automation
  source_url: https://github.com/mb26-dev/ha-magmarium/blob/main/blueprints/automation/magmarium/alert_level_change.yaml
  input:
    volcano:
      name: Volcano
      description: The Magmarium sensor of a watched volcano
      selector:
        entity:
          filter:
            - integration: magmarium
              domain: sensor
    only_increase:
      name: Only when the level rises
      default: false
      selector:
        boolean: {}
    ash_alert:
      name: Also notify about new ash clouds
      default: true
      selector:
        boolean: {}
    actions:
      name: Actions
      description: >-
        What to do, e.g. a notification. Available variables: volcano, level, previous,
        alert, ash_top_m, ash_moving_to, text, url.
      selector:
        action: {}

mode: queued
max: 5

triggers:
  - trigger: state
    entity_id: !input volcano
    id: level
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
  - trigger: state
    entity_id: !input volcano
    attribute: ash_cloud
    to: true
    id: ash

variables:
  only_increase: !input only_increase
  ash_alert: !input ash_alert
  order:
    unknown: 0
    normal: 1
    advisory: 2
    watch: 3
    warning: 4
  volcano: "{{ state_attr(trigger.entity_id, 'local_name') or state_attr(trigger.entity_id, 'volcano') }}"
  level: "{{ trigger.to_state.state }}"
  previous: "{{ trigger.from_state.state if trigger.from_state else 'unknown' }}"
  alert: "{{ state_attr(trigger.entity_id, 'alert') or '' }}"
  ash_top_m: "{{ state_attr(trigger.entity_id, 'ash_top_m') }}"
  ash_moving_to: "{{ state_attr(trigger.entity_id, 'ash_moving_to') }}"
  text: "{{ state_attr(trigger.entity_id, 'notice_text') or '' }}"
  url: "{{ state_attr(trigger.entity_id, 'url') or '' }}"

conditions:
  - condition: template
    value_template: >-
      {% if trigger.id == 'ash' %}
        {{ ash_alert }}
      {% else %}
        {{ trigger.from_state.state != trigger.to_state.state and
           (not only_increase or order.get(level, 0) > order.get(previous, 0)) }}
      {% endif %}

actions: !input actions
