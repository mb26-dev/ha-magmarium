name: Render screenshots

on:
  push:
    paths:
      - "docs/demo/**"
      - "custom_components/magmarium/frontend/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  render:
    name: Render README screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Download the NASA Earth images
        run: |
          month=$(date -u +%m)
          name=$(date -u +%B | tr '[:upper:]' '[:lower:]')
          curl -fsSL -o docs/demo/earth_day.jpg "https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-topography-bathymetry/${name}/world.topo.bathy.2004${month}.3x5400x2700.jpg" \
            || curl -fsSL -o docs/demo/earth_day.jpg "https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-topography-bathymetry/september/world.topo.bathy.200409.3x5400x2700.jpg"
          curl -fsSL -o docs/demo/earth_night.jpg "https://assets.science.nasa.gov/content/dam/science/esd/eo/images/imagerecords/144000/144898/BlackMarble_2016_01deg.jpg"
      - name: Download the wildfires of the last 24 hours (public NASA FIRMS files, no key)
        run: |
          base=https://firms.modaps.eosdis.nasa.gov/data/active_fire
          curl -fsSL -o docs/demo/fires_noaa20.csv "$base/noaa-20-viirs-c2/csv/J1_VIIRS_C2_SouthEast_Asia_24h.csv" || true
          curl -fsSL -o docs/demo/fires_noaa21.csv "$base/noaa-21-viirs-c2/csv/J2_VIIRS_C2_SouthEast_Asia_24h.csv" || true
          curl -fsSL -o docs/demo/fires_snpp.csv "$base/suomi-npp-viirs-c2/csv/SUOMI_VIIRS_C2_SouthEast_Asia_24h.csv" || true
          python docs/demo/fires.py || true
      - name: Download the earthquakes of the week (public USGS feeds)
        run: |
          curl -fsSL -o docs/demo/quakes_week.geojson "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson" || true
          curl -fsSL -o docs/demo/quakes_day.geojson "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson" || true
          python docs/demo/quakes.py || true
      - name: Render
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python docs/demo/render.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git diff --cached --quiet || (git commit -m "Render README screenshots" && git pull --rebase && git push)
