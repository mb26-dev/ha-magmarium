<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Animated Globe Tsunami Marker">
  <defs>
    <!-- Deep Volumetric Ocean Wall Gradient (Matches 3D Globe Lighting) -->
    <linearGradient id="waveBodyTS" x1="15%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#062c46" />
      <stop offset="40%" stop-color="#0369a1" />
      <stop offset="78%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Front Steep Shaded Wave Face -->
    <linearGradient id="waveFaceTS" x1="0%" y1="100%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#041e33" stop-opacity="0.88" />
      <stop offset="55%" stop-color="#0c4a6e" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.22" />
    </linearGradient>

    <!-- Hollow Under-Lip Shadow Cavity -->
    <linearGradient id="hollowTS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03192b" />
      <stop offset="65%" stop-color="#083344" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Luminous Foaming Crest Rim -->
    <linearGradient id="lipGradTS" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="42%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Perspective Ground Ring Gradient (Luminous Cyan-Aqua) -->
    <linearGradient id="ringGradTS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Ambient Ocean Pool Glow Inside Ring -->
    <radialGradient id="poolGlowTS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.48" />
      <stop offset="68%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <filter id="shadowTS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#020617" flood-opacity="0.78" />
    </filter>

    <filter id="glowTS" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Globe-Surface Perspective Base Rings (Matches Volcano Ground Rings) -->
  <g>
    <!-- Soft Ambient Ocean Glow Disc -->
    <ellipse cx="64" cy="96" rx="46" ry="14" fill="url(#poolGlowTS)" />

    <!-- Expanding Seismic / Tsunami Shockwave Ripple 1 -->
    <ellipse cx="64" cy="96" rx="40" ry="12.2" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.9">
      <animate attributeName="rx" values="40; 61" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="ry" values="12.2; 18.6" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9; 0" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="1.6; 0.5" dur="2.4s" repeatCount="indefinite" />
    </ellipse>

    <!-- Expanding Seismic / Tsunami Shockwave Ripple 2 (Staggered) -->
    <ellipse cx="64" cy="96" rx="40" ry="12.2" fill="none" stroke="#7dd3fc" stroke-width="1.3" opacity="0.85">
      <animate attributeName="rx" values="40; 61" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="ry" values="12.2; 18.6" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.85; 0" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="1.4; 0.4" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
    </ellipse>

    <!-- Back Half of Primary Glowing Perspective Base Ring -->
    <path d="M 24 96 A 40 12.2 0 0 1 104 96" fill="none" stroke="url(#ringGradTS)" stroke-width="2.8" stroke-linecap="round" filter="url(#glowTS)" />
  </g>

  <!-- 2. Rising Translucent Mist & Sea Spray Above Crest (Echoing Volcano Ash Plume) -->
  <g>
    <circle cx="80" cy="30" r="4.0" fill="#bae6fd" opacity="0.45">
      <animate attributeName="cy" values="34; 14" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="cx" values="80; 85" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.0; 6.0" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5; 0" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="69" cy="28" r="3.4" fill="#7dd3fc" opacity="0.4">
      <animate attributeName="cy" values="32; 12" dur="2.5s" begin="1.25s" repeatCount="indefinite" />
      <animate attributeName="cx" values="69; 65" dur="2.5s" begin="1.25s" repeatCount="indefinite" />
      <animate attributeName="r" values="2.6; 5.2" dur="2.5s" begin="1.25s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.45; 0" dur="2.5s" begin="1.25s" repeatCount="indefinite" />
    </circle>

    <!-- Crisp Luminous Spray Sparks -->
    <circle cx="88" cy="34" r="1.6" fill="#ffffff">
      <animate attributeName="cy" values="37; 18" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="cx" values="88; 95" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.95; 0" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="75" cy="29" r="1.4" fill="#38bdf8">
      <animate attributeName="cy" values="32; 15" dur="1.6s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="cx" values="75; 72" dur="1.6s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.95; 0" dur="1.6s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="95" cy="40" r="1.4" fill="#e0f2fe">
      <animate attributeName="cy" values="42; 26" dur="1.6s" begin="1.05s" repeatCount="indefinite" />
      <animate attributeName="cx" values="95; 102" dur="1.6s" begin="1.05s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9; 0" dur="1.6s" begin="1.05s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 3. 3D Volumetric Tsunami Wave Rising from the Globe Base -->
  <g filter="url(#shadowTS)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-1 1.4; 1.2 -1.6; -1 1.4" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="2.1s" repeatCount="indefinite" />

      <!-- Main Towering Sweeping Tsunami Wall -->
      <path d="M 27 95 C 42 88, 52 66, 63 42 C 71 27, 90 27, 97 44 C 88 37, 78 42, 76 54 C 74 66, 83 80, 99 95 C 77 101, 49 101, 27 95 Z" fill="url(#waveBodyTS)" />

      <!-- Steep Concave Shaded Front Face (3D Volume) -->
      <path d="M 27 95 C 42 88, 52 66, 63 42 C 67 34, 73 31, 78 31 C 70 43, 64 66, 63 99 C 49 99, 37 98, 27 95 Z" fill="url(#waveFaceTS)" />

      <!-- Deep Hollow Curling Cavity Under the Lip -->
      <path d="M 70 97 C 69 75, 73 54, 83 47 C 88 44, 93 46, 94 51 C 87 50, 82 55, 82 66 C 82 77, 89 87, 99 95 C 89 98, 79 98, 70 97 Z" fill="url(#hollowTS)" />

      <!-- Hydro-Fluted Water Flow Lines (Echoing Volcano Cone Flutes) -->
      <path d="M 38 96 C 49 84, 57 65, 66 44" fill="none" stroke="#38bdf8" stroke-width="1.25" stroke-opacity="0.7" stroke-linecap="round" />
      <path d="M 49 98 C 57 85, 62 67, 70 46" fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.72" stroke-linecap="round" />
      <path d="M 60 99 C 64 85, 67 68, 73 49" fill="none" stroke="#0ea5e9" stroke-width="1.15" stroke-opacity="0.75" stroke-linecap="round" />

      <!-- Secondary Foreground Breaking Wave Surge at Lower Left -->
      <path d="M 29 94 C 37 88, 43 79, 50 74 C 55 70, 62 72, 64 78 C 59 76, 55 79, 55 84 C 55 89, 59 94, 65 98 C 52 99, 39 98, 29 94 Z" fill="#0284c7" opacity="0.9" />
      <path d="M 31 93 C 38 87, 44 79, 50 74 C 55 70, 61 72, 63 77" fill="none" stroke="#e0f2fe" stroke-width="2.1" stroke-linecap="round" />

      <!-- Luminous Curling Main Crest Rim -->
      <path d="M 55 55 C 59 48, 62 43, 64 39 C 72 26, 90 27, 97 44 C 94 48, 89 47, 87 43" fill="none" stroke="url(#lipGradTS)" stroke-width="3.5" stroke-linecap="round" filter="url(#glowTS)">
        <animate attributeName="stroke-width" values="3.0; 4.1; 3.0" dur="2.1s" repeatCount="indefinite" />
      </path>

      <!-- Foaming Whitewater Plume at Impact Curl -->
      <g fill="#ffffff">
        <circle cx="91" cy="45" r="2.8" opacity="0.95">
          <animate attributeName="r" values="2.2; 3.4; 2.2" dur="1.4s" repeatCount="indefinite" />
        </circle>
        <circle cx="96" cy="49" r="2.2" opacity="0.9">
          <animate attributeName="r" values="2.7; 1.8; 2.7" dur="1.4s" repeatCount="indefinite" />
        </circle>
        <circle cx="86" cy="49" r="2.0" opacity="0.85" />
      </g>
    </g>
  </g>

  <!-- 4. Front Half of Primary Glowing Perspective Base Ring (Overlaps Wave Foot for True 3D Depth) -->
  <path d="M 24 96 A 40 12.2 0 0 0 104 96" fill="none" stroke="url(#ringGradTS)" stroke-width="3.1" stroke-linecap="round" filter="url(#glowTS)" />
</svg>
