<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="FIRMS Wildfire Hotspot Icon">
  <defs>
    <!-- Outer Flame Gradient (Deep Crimson Base to Vivid Flame Orange) -->
    <linearGradient id="flameOuterFR" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="32%" stop-color="#dc2626" />
      <stop offset="72%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Mid Flame Gradient (Rich Orange to Warm Gold) -->
    <linearGradient id="flameMidFR" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="48%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Inner Thermal Core Gradient (Bright Yellow to White-Hot Center) -->
    <linearGradient id="flameCoreFR" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="55%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Drop Shadow for Crisp Contrast on Globe & Colored Rings -->
    <filter id="shadowFR" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#020617" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Ring-Free Wildfire Silhouette (Centered for Separate Intensity Ring Underneath) -->
  <g filter="url(#shadowFR)">
    <!-- Outer Bold Wildfire Silhouette (Anchored at Base 64, 115) -->
    <g transform="translate(64 115)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1; 1.025 0.975; 0.985 1.025; 1 1" keyTimes="0; 0.35; 0.7; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" dur="1.8s" repeatCount="indefinite" />
        <path d="M 0 0 C -26 0, -41 -17, -40 -41 C -39 -56, -31 -68, -22 -77 C -24 -67, -21 -61, -16 -59 C -18 -78, -8 -95, 7 -104 C 4 -91, 9 -81, 17 -75 C 18 -81, 21 -86, 25 -89 C 34 -77, 41 -61, 40 -41 C 39 -17, 24 0, 0 0 Z" fill="url(#flameOuterFR)" stroke="#2a0808" stroke-width="2.2" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Mid Golden-Amber Inner Flame (Anchored at Base 64, 111) -->
    <g transform="translate(64 111)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1; 0.97 1.03; 1.02 0.97; 1 1" keyTimes="0; 0.4; 0.75; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" dur="1.45s" repeatCount="indefinite" />
        <path d="M 0 0 C -18 0, -29 -13, -28 -31 C -27 -42, -22 -51, -16 -57 C -17 -50, -14 -46, -11 -45 C -12 -59, -5 -72, 6 -80 C 4 -70, 8 -62, 14 -58 C 21 -50, 27 -40, 26 -29 C 25 -12, 15 0, 0 0 Z" fill="url(#flameMidFR)" />
      </g>
    </g>

    <!-- Inner White-Yellow Thermal Core (Anchored at Base 64, 107) -->
    <g transform="translate(64 107)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1; 1.04 0.95; 0.97 1.04; 1 1" keyTimes="0; 0.35; 0.7; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" dur="1.15s" repeatCount="indefinite" />
        <path d="M 0 0 C -12 0, -19 -9, -18 -22 C -17 -33, -10 -44, 1 -53 C 0 -45, 3 -40, 7 -37 C 12 -32, 16 -26, 15 -19 C 14 -8, 9 0, 0 0 Z" fill="url(#flameCoreFR)" />
      </g>
    </g>
  </g>
</svg>